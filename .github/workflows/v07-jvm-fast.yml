name: V0.7 JVM Fast Gate

on:
  push:
    branches:
      - feat/v07-mobilei2v-gpu
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/**'
      - 'app/src/test/java/**'
      - 'app/build.gradle'
      - '.github/workflows/v07-jvm-fast.yml'

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compile SDK only
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run JVM tests
        run: gradle :app:testDebugUnitTest --stacktrace
