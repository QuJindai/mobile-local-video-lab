name: Face-RE Static APK

on:
  push:
    branches:
      - feat/v090-face-re
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify model download source contract
        shell: bash
        run: |
          set -euo pipefail
          CATALOG=facere/src/main/java/com/qujindai/facere/FaceModelDownloadCatalog.java
          DOWNLOADER=facere/src/main/java/com/qujindai/facere/FaceModelDownloader.java
          UI=facere/src/main/java/com/qujindai/facere/FaceReMainActivity.java
          grep -q 'https://github.com/deepinsight/insightface/releases/download/model-zoo/buffalo_l.zip' "$CATALOG"
          grep -q 'https://github.com/deepinsight/insightface/releases/download/model-zoo/inswapper_128.onnx' "$CATALOG"
          grep -q 'https://hf-mirror.com' "$CATALOG"
          grep -q '80ffe37d8a5940d59a7384c201a2a38d4741f2f3c51eef46ebb28218a7b0ca2f' "$CATALOG"
          grep -q '5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91' "$CATALOG"
          grep -q '4c06341c33c2ca1f86781dab0e829f88ad5b64be9fba56e56bc9ebdefc619e43' "$CATALOG"
          grep -q 'e4a3f08c753cb72d04e10aa0f7dbe3deebbf39567d4ead6dce08e98aa49e16af' "$CATALOG"
          grep -q 'Range' "$DOWNLOADER"
          grep -q 'OnnxEmapExtractor.extract' "$DOWNLOADER"
          grep -q '国内镜像优先' "$UI"
          grep -q '模型许可与隐私' "$UI"

      - name: Run Face-RE JVM tests
        run: gradle :facere:testDebugUnitTest --stacktrace

      - name: Assemble Face-RE APK
        run: gradle :facere:assembleDebug --stacktrace

      - name: Verify static-only APK
        shell: bash
        run: |
          set -euo pipefail
          APK=facere/build/outputs/apk/debug/facere-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          grep "versionCode='12'" apk-badging.txt
          grep "versionName='0.9.1'" apk-badging.txt
          grep "launchable-activity: name='com.qujindai.facere.FaceReMainActivity'" apk-badging.txt
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          if grep -q 'android.permission.ACCESS_NETWORK_STATE' apk-permissions.txt; then
            echo 'Face-RE model downloader does not require ACCESS_NETWORK_STATE' >&2
            exit 1
          fi
          unzip -l "$APK" | grep 'lib/arm64-v8a/libonnxruntime.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libonnxruntime4j_jni.so'
          if unzip -l "$APK" | grep -Eiq 'librife|mobilei2v|depth-anything|flownet|assets/.*\.onnx|inswapper_128\.onnx|det_10g\.onnx|w600k_r50\.onnx|emap\.bin'; then
            echo 'forbidden legacy/model payload found in Face-RE APK' >&2
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -qi 'c9329387060f0259870e30b7bca6b9d9684ed86de716676962a1e75ef7f346ac' apk-signing.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload Face-RE APK
        uses: actions/upload-artifact@v4
        with:
          name: face-re-v0.9.1-static-apk
          path: |
            facere/build/outputs/apk/debug/facere-debug.apk
            apk-badging.txt
            apk-permissions.txt
            apk-signing.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
