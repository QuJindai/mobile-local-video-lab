name: FACE-RE real model qualification

on:
  push:
    branches: [feat/face-re-mainline]
    paths:
      - 'tools/face/qualify_models.py'
      - '.github/workflows/face-model-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'onnx==1.18.0' 'onnxruntime==1.23.2' 'opencv-python-headless==4.12.0.88'
      - name: Execute actual detector, identity encoder and face swapper
        run: python tools/face/qualify_models.py
      - name: Upload model qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-re-model-qualification
          path: build/face-qualification/
          if-no-files-found: warn
          retention-days: 14
